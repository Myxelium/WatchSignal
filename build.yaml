overview: "Shows when the next episode or season airs on the series page."
description: >
  Adds one line to the series page with the next episode air date.
  When that release is the premiere of a season, the line says when the season premieres.
  Supports Jellyfin 10.11.8 and later. Jellyfin 12 uses a separate net10.0 build with targetAbi 12.0.0.0.
category: "General"
artifacts:
  - "Jellyfin.Plugin.WatchSignal.dll"
changelog: >
  Show the next episode on the series page. When the next release is a new season, say when that season premieres.
